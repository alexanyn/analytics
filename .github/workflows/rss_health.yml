name: RSS Source Health Check

on:
  schedule:
    - cron: '0 6 * * 1'  # Каждый понедельник в 09:00 МСК
  workflow_dispatch: {}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      - name: Run health check
        run: python rss_health_check.py

      - name: Commit health report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -f rss_health.json ]; then
            git add rss_health.json
          fi
          git commit -m "Update RSS health report [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
